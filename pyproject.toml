# uv-workspace: общий протокол, API и воркер. Корень виртуальный — сам не пакет.
[tool.uv.workspace]
members = ["protocol", "api", "worker"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx2>=0.1",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff.lint.isort]
known-first-party = ["compilehub_protocol", "compilehub_api", "compilehub_worker"]
